apiVersion: v1
kind: Namespace
metadata:
  name: observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: log-collector
  namespace: observability
data:
  config.yaml: |
    log:
      level: info
      format: json
      file: ""
      also_stdout: true

    state:
      path: /var/lib/log-collector/positions.json

    sources:
      containers:
        - name: kubernetes-cri-stdout
          include:
            - /var/log/containers/*.log
          exclude:
            - /var/log/containers/log-collector_*_*.log
          format: cri
          start_at: end
          attributes:
            deployment.environment: kubernetes

    export:
      enabled: true
      # 修改为集群内实际的 OpenTelemetry Collector Service 地址。
      endpoint: http://opentelemetry-collector.observability.svc.cluster.local:4318
      compression: gzip
      timeout: 10s
      batch_size: 500
      max_batch_bytes: 4194304
      flush_interval: 1s
      queue_size: 10000
      max_queue_bytes: 67108864
      retry:
        enabled: true
        initial_interval: 1s
        max_interval: 30s
        max_elapsed_time: 5m

    wechat_webhook:
      enabled: false
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: log-collector
  namespace: observability
  labels:
    app.kubernetes.io/name: log-collector
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: log-collector
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: log-collector
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: log-collector
          # 发布镜像后替换为实际版本，生产环境不要使用 latest。
          image: ghcr.io/ha1377311454/log-collector:latest
          imagePullPolicy: IfNotPresent
          args:
            - -config
            - /etc/log-collector/config.yaml
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            # 节点日志和由 hostPath 创建的位点目录通常属于 root。
            runAsUser: 0
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/log-collector
              readOnly: true
            - name: positions
              mountPath: /var/lib/log-collector
            - name: var-log
              mountPath: /var/log
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: log-collector
        - name: positions
          hostPath:
            path: /var/lib/log-collector
            type: DirectoryOrCreate
        - name: var-log
          hostPath:
            path: /var/log
            type: Directory
